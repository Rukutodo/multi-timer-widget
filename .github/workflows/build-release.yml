name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.5.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.5.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.5
          name: "Multi-Timer Widget v1.0.5"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.5

            **YouTube Music Integration + Hero Timer Card Widget + OnePlus Launcher Engine**

            #### 🌟 What's New in v1.0.5:
            - ▶️ **YouTube Music Integration**:
              - Set songs, playlists, or artist tracks from YouTube Music (`com.google.android.apps.youtube.music`) as custom alarm sounds for individual timers.
              - Quick curated presets: `🎧 Lo-Fi Chill`, `⚡ Workout Hype`, `☕ Morning Ambient`, `🌌 Synthwave Focus`.
              - When your timer finishes, it launches and plays directly in YouTube Music while sounding a loud alarm chime and vibration so you never miss an alert.
              - Prominent `[▶️ Open YouTube Music]` heads-up notification action button with full-screen popup.
            - 🃏 **Brand New Hero Timer Card Widget**:
              - Standalone, high-fidelity **Timer Card (Hero Widget)** for your home screen.
              - Big glowing countdown typography (`00:25:00`) and tactile Play/Pause and Reset buttons.
              - Quick `<` and `>` flip controls to cycle through all your active timers directly on the card without opening the app.
            - 🛡️ **Guaranteed Widget Reliability (OnePlus / OxygenOS & Android 16)**:
              - Fixed Launcher IPC security tokens using `Binder.clearCallingIdentity()`.
              - Bounded FrameLayout containers to eliminate OnePlus Launcher inflation failures.
              - Exported widget action receiver for instant touch response.
            - 🎵 **System Audio / File Picker**: Pick local music files, MP3s, or device ringtones with `USAGE_ALARM` loud playback.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.5.apk`** below to install or update!
          files: release_assets/multi-timer-widget-v1.0.5.apk
          draft: false
          prerelease: false
