name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.10.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.10.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.10
          name: "Multi-Timer Widget v1.0.10 - Liquid Fluid Wave Animation Engine"
          body: |
            ### 🌊 Multi-Timer Widget Release v1.0.10

            **Hardware-Accelerated Fluid Liquid Wave Animation + Obsidian Frosted Glass UI**

            #### 🌟 What's New in v1.0.10:
            - 🌊 **Organic Fluid Liquid Wave Animation**:
              - When any countdown timer is running, an organic, hardware-accelerated dual-layer sinusoidal wave ripples and rises smoothly in the background of the card.
              - The fluid surface height dynamically rises in real time as elapsed progress increases.
              - Dual wave layers: translucent background crest and luminous foreground ripple with a hairline highlight.
              - Context-aware tinting: subtle slate-cyan for system alarms and muted wine for YouTube Music timers.
              - Zero battery waste when paused or idle (animators cancel automatically).
            - 📐 **Zero Rounded Corners & Obsidian Glass Aesthetic**:
              - Preserved 100% strict zero-radius architectural edges across all views, dialogs, and widgets.
            - 🎵 **YouTube Music Library & Widget Custom Time**:
              - Direct playlist library opening, clipboard link paste, and quick custom time dialog directly from the widget surface.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.10.apk`** below to install!
          files: release_assets/multi-timer-widget-v1.0.10.apk
          draft: false
          prerelease: false


