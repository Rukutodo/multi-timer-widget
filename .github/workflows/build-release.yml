name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.7.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.7.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.7
          name: "Multi-Timer Widget v1.0.7 - Modern UI Redesign"
          body: |
            ### 🎨 Multi-Timer Widget Release v1.0.7 - Modern UI Overhaul

            **Complete 2026 Material 3 Glassmorphism Redesign + New Modern Chrono App Icon + Live Stats Bar**

            #### 🌟 What's New in v1.0.7:
            - 🎨 **Brand New 2026 Pro App Icon**:
              - Replaced outdated styling with deep obsidian glass, dual luminous arcs (Electric Cyan `#00F0FF` & Emerald `#10B981`), and sleek floating chrono nodes.
            - 📊 **Executive Stats Pill Bar**:
              - Live dashboard header with active counters: `⚡ Active Timers`, `● Running Timers`, and `🔋 Current Render Engine`.
            - 🪟 **Modern Glassmorphic Cards (24dp rounded corners)**:
              - Elevated Obsidian cards (`#0F172A`) with luminous subtle borders (`#2E3E57`).
              - High-contrast electric cyan 44sp countdown digits with JetBrains/Inter digital legibility.
              - Rounded-cap gradient progress tracks (`#0284C7` to `#00F0FF`).
            - ⏳ **Empty State Placeholder**:
              - Engaging graphical empty state when no timers are active.
            - 🪟 **Enhanced Add / Edit Sheet**:
              - Added drag handle indicator pill, 16dp rounded input fields, and redesigned YouTube Music integration vibe chips.
            - ⚡ **OxygenOS 16 / RemoteViews Compatibility**:
              - All launcher widget layouts retain 100% RemoteViews-safe architecture.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.7.apk`** below to install!
          files: release_assets/multi-timer-widget-v1.0.7.apk
          draft: false
          prerelease: false
