name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.3.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.3.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Multi-Timer Widget v1.0.3"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.3

            **Custom Per-Timer Music & Sound Selection**

            #### 🌟 What's New in v1.0.3:
            - 🎵 **Custom Music & Sound for Each Timer**: Select different music, songs, or ringtones for different timers!
              - Choose from system ringtones, alarms, or your own local music files / downloads.
              - When that specific timer finishes, it rings aloud playing your chosen audio track.
            - 🏷️ **Music Track Display**: Each timer card in the app displays the assigned sound name (`🎵 Focus Chimes`, `🎵 My Song.mp3`, etc.).
            - 🔊 **Loud Audio Alarm**: Bound `AudioAttributes.USAGE_ALARM` to ring aloud over the alarm audio stream.
            - 🎨 **Modern 2026 UI & Adaptive Icon**: Neon obsidian aesthetic with quick preset chips (`1m`, `5m`, `15m`, `25m Focus`, `45m`, `60m`).
            - 📱 **OnePlus (OxygenOS) Widget Compatibility**: Fully tested and optimized for OnePlus Launcher with zero RemoteViews crash bugs.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.3.apk`** below to install or update!
          files: release_assets/multi-timer-widget-v1.0.3.apk
          draft: false
          prerelease: false
