name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.12.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.12.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.12
          name: "Multi-Timer Widget v1.0.12 - Real-Time Fluid Wave Animation for Widgets"
          body: |
            ### 🌊 Multi-Timer Widget Release v1.0.12

            **Organic Fluid Liquid Wave Animation on Home Screen Widgets + Circular Ring Progress**

            #### 🌟 What's New in v1.0.12:
            - 🌊 **Organic Fluid Liquid Wave Animation on Widgets**:
              - **Dual-Sinusoidal Wave Generator**: Dynamic hardware-accelerated canvas wave rendering on home screen widgets via `WidgetWaveRenderer`.
              - **Hero Single-Timer Widget**: Background wave chamber ripples and dynamically shifts water height with the progress of the active timer.
              - **Multi-Timer List Widget**: Each timer row has an ambient liquid chamber that flows horizontally and rises as the timer ticks.
              - **RemoteViews IPC Optimized**: Uses low-memory ARGB_8888 bitmap buffers (~180-240KB) strictly adhering to the Android Binder IPC limit to prevent `TransactionTooLargeException`.
            - 🔘 **Circular Progress Ring with Glowing Ending Bead on Widgets**:
              - Precise circular gauge with glowing endpoint bead tracking countdown progress.
            - 📐 **Obsidian Architectural Aesthetic**:
              - Strict zero rounded corners (`0dp`), obsidian slate glass finish (`#090A0D`, `#13141B`), and muted low-contrast accents.
            - 🎵 **YouTube Music Deep Integration & In-Widget Custom Time Adder**:
              - Direct picker for custom timer durations and deep-linking into YouTube Music playlists.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.12.apk`** below to install!
          files: release_assets/multi-timer-widget-v1.0.12.apk
          draft: false
          prerelease: false



