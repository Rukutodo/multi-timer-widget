name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.4.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.4.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Multi-Timer Widget v1.0.4"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.4

            **Major Widget Reliability Engine + Brand New Hero Card Widget**

            #### 🌟 Highlights & Fixes in v1.0.4:
            - 🛡️ **Guaranteed Widget Loading (OxygenOS / OnePlus)**:
              - Added `Binder.clearCallingIdentity()` around RemoteViews data retrieval to prevent IPC permission blocks by system launcher services.
              - Refactored widget list containers with bounded FrameLayout to eliminate layout measurement overflow.
              - Added immediate `notifyAppWidgetViewDataChanged` triggering on widget initialization.
              - Set `android:exported="true"` on `WidgetActionReceiver` so OnePlus Launcher can trigger Play/Pause/Reset broadcasts.
            - 🃏 **Brand New Hero Timer Card Widget**:
              - In addition to the scrollable list, you now have a standalone **Timer Card (Hero Widget)**!
              - Big glowing countdown digits (`00:25:00`).
              - Prominent tactile Play/Pause and Reset buttons.
              - Quick `<` and `>` flip buttons to cycle through all your named timers directly on the card!
              - Works without adapter services, guaranteeing 100% reliability on any launcher.
            - 🎵 **Custom Music & Ringtones**: Pick distinct songs or ringtones for each timer with loud `USAGE_ALARM` playback.
            - 🎨 **Modern 2026 Obsidian UI & Adaptive Chrono Icon**.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.4.apk`** below to install or update!
          files: release_assets/multi-timer-widget-v1.0.4.apk
          draft: false
          prerelease: false
