name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.2.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.2.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Multi-Timer Widget v1.0.2"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.2

            **Loud Alarm Sound + Modern 2026 UI & Icon Redesign**

            #### 🌟 What's New in v1.0.2:
            - 🔊 **Loud Audio Alarm**: Bound `AudioAttributes.USAGE_ALARM` to both the notification channel and direct `Ringtone` playback so finished timers ring aloud over system alarm streams even if notifications are quiet.
            - 🎨 **Modern Adaptive App Icon**: Replaced old 2010 lock icon with a custom modern neon chronograph adaptive icon.
            - ✨ **Complete UI Redesign**:
              - Luxury OLED obsidian backgrounds (`#06090E`) with vibrant cyan (`#00F0FF`) and emerald (`#10B981`) accents.
              - Big hero countdown typography (40sp) with high-contrast pill action buttons.
              - Quick preset chips (`1m`, `5m`, `15m`, `25m Focus`, `45m`, `60m`) in the creation dialog.
              - Glassmorphic card styling for both the app and the home screen widget.
            - 📱 **OnePlus & OxygenOS Optimization**: Fully compatible with OnePlus launcher and Android 14/15/16.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.2.apk`** below to install the update!
          files: release_assets/multi-timer-widget-v1.0.2.apk
          draft: false
          prerelease: false
