name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.1.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Multi-Timer Widget v1.0.1"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.1

            **Fixes for OnePlus (OxygenOS) & Android 14/15/16 Launcher Widget Loading**

            #### 🛠️ Fixes in this release:
            - **Fixed "Problem loading widget" error**: Removed unsupported `<ripple>` XML tags from widget RemoteViews buttons that caused OnePlus Launcher inflation to abort.
            - **Unified Single-Type Layout**: Consolidated widget item layout into a single, bulletproof XML template with `viewTypeCount = 1` to prevent launcher view recycling errors.
            - **Clean Framework Progress Bar**: Standardized progress bars to use framework styles that resolve across all third-party and OEM launcher themes.
            - **Proper RemoteViews URI Hook**: Standardized adapter data URI for seamless widget provider sync.
            
            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.1.apk`** below to update or install!
          files: release_assets/multi-timer-widget-v1.0.1.apk
          draft: false
          prerelease: false
