name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.8.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.8.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.8
          name: "Multi-Timer Widget v1.0.8 - Sharp Frosted Glass (Zero Radius)"
          body: |
            ### ⬛ Multi-Timer Widget Release v1.0.8 - Sharp Frosted Glass Redesign

            **Zero Rounded Corners + Grayish-Black Obsidian + Subtle Muted Hints + Frosted Glass**

            #### 🌟 What's New in v1.0.8:
            - 📐 **Zero Rounded Corners**:
              - All cards, buttons, chips, dialogs, progress bars, and launcher widgets now feature razor-sharp, zero-radius architectural edges.
            - 🖤 **Grayish-Black Obsidian Color Scheme**:
              - Deep obsidian backgrounds (`#090A0D`), dark frosted slate cards (`#13141B`), and hairline borders (`#242632`).
            - 🎨 **Subtle, Non-Contrasty Accents**:
              - Replaced harsh neons with muted slate smoke (`#6B8FA3`), earthy sage (`#638573`), and warm taupe (`#947D60`).
            - 🪟 **Sharp Frosted Glass Launcher Widgets**:
              - Both the Multi-Timer list and Single-Timer hero widgets rendered with zero radius and clean frosted panels.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.8.apk`** below to install!
          files: release_assets/multi-timer-widget-v1.0.8.apk
          draft: false
          prerelease: false
