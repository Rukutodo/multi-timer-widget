name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.11.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.11.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.11
          name: "Multi-Timer Widget v1.0.11 - Circular Ring Progress with Glowing Circle Ending"
          body: |
            ### 🔘 Multi-Timer Widget Release v1.0.11

            **Circular Progress Ring Gauge with Glowing Circle Ending Bead on Home Screen Widgets + Fluid Waves**

            #### 🌟 What's New in v1.0.11:
            - 🔘 **Circular Progress Ring with Glowing Circle Ending Bead on Widgets**:
              - **Hero Single-Timer Widget**: The countdown digits are now surrounded by an anti-aliased circular progress ring (`WidgetRingRenderer`) with a prominent glowing circle indicator bead at the tip of the sweeping arc.
              - **List Widget (Multi-Timer)**: Each active timer row features an instrument mini-dial with the sweeping arc and glowing circle bead.
              - **Dynamic State**: The bead tracks elapsed time in real time and pulses when the timer is in the `RUNNING` state.
              - Context-tinted with slate cyan (`#6B8FA3`) or muted berry (`#8F5A62`) for YouTube Music timers.
            - 🌊 **Organic Fluid Liquid Wave Animation in App**:
              - In-app timer cards feature hardware-accelerated dual sinusoidal wave animations that gently ripple and rise as timers run.
            - 📐 **Zero Rounded Corners & Obsidian Glass Aesthetic**:
              - Clean architectural zero-radius cards with frosted slate glass backgrounds.
            - 🎵 **YouTube Music Library Integration & Quick Custom Duration**:
              - Direct playlist library opening and home screen widget custom time input dialog.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.11.apk`** below to install!
          files: release_assets/multi-timer-widget-v1.0.11.apk
          draft: false
          prerelease: false



