name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/multi-timer-widget-v1.0.6.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-timer-widget-apk
          path: release_assets/multi-timer-widget-v1.0.6.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.6
          name: "Multi-Timer Widget v1.0.6"
          body: |
            ### 📱 Multi-Timer Widget Release v1.0.6

            **OnePlus Launcher Inflation Fixes + In-App Widget Diagnostics Tool + Exported RemoteViewsService**

            #### 🛠️ Root-Cause Fixes in v1.0.6:
            - 🛡️ **Exported `MultiTimerWidgetService` (`android:exported="true"`)**:
              - Previously, `MultiTimerWidgetService` had `android:exported="false"`, which caused the OnePlus Launcher (`com.oneplus.launcher`) to be blocked by Android SecurityException from binding to the list adapter.
              - Now explicitly exported with `android.permission.BIND_REMOTEVIEWS` so the launcher can freely bind and display timers.
            - 🚫 **Eliminated Forbidden `<View>` RemoteViews Tags**:
              - In Android, standard `<View>` tags are not permitted in `RemoteViews` layouts and trigger `InflateException: Class not allowed to be inflated in RemoteViews`.
              - Replaced all `<View>` divider tags in both `widget_multi_timer.xml` and `widget_single_timer.xml` with fully compliant `<FrameLayout>` containers.
            - 🔄 **Sanitized Widget Button Attributes**:
              - Removed unsupported `android:rotation` attributes in `widget_single_timer.xml`, replacing with crisp Unicode vector pills (`◀` and `▶`).
            - 🛠️ **Brand New In-App Widget Diagnostics Inspector**:
              - Tap **`🛠️ Diagnostics`** in the app header to instantly test:
                - Real-time `RemoteViews` XML inflation test on your actual device.
                - Verification that `MultiTimerWidgetService` is properly exported.
                - Detection of placed widgets on your home screen.
                - One-tap **"📋 Copy Report"** and **"🔄 Force Refresh"**.
            - ▶️ **YouTube Music Integration**:
              - Set YouTube Music tracks/playlists as per-timer alarm sounds with full-screen heads-up notification and auto-launch.

            #### 📥 Download & Install
            Download **`multi-timer-widget-v1.0.6.apk`** below to install or update!
          files: release_assets/multi-timer-widget-v1.0.6.apk
          draft: false
          prerelease: false
